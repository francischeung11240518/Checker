name = "checker-auth-watchlist"
main = "src/index.js"
compatibility_date = "2026-10-13"

# Kill switch is on for the deployed Worker. AUTH_ENABLED is "true".
# Do not put secrets in this file.
# Sign in with Apple is not in v1 (paid Apple Developer required). Do not add Apple vars yet.
[vars]
AUTH_ENABLED = "true"
GOOGLE_CLIENT_ID = "175392803528-9840t8fvs62gur5sa5p9immqkpkid3k6.apps.googleusercontent.com"
WATCHLIST_MAX = "50"
SESSION_TTL_SECONDS = "604800"

# Secrets (wrangler secret put). Never commit values:
#   SESSION_SECRET          signs the Bearer JWT; never commit the value
# ID-token verification uses Google's public keys. v1 does not read:
#   GOOGLE_CLIENT_SECRET

# D1 checker-auth-watchlist. database_id is the public binding id, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "checker-auth-watchlist"
database_id = "2ddb2690-d53c-48a7-949d-8118b8fe6762"
migrations_dir = "migrations"
